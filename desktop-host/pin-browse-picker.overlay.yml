# Pin the in-app directory picker for the WebView2 desktop wrapper.
# The shipped web row is directory-picker-auto, which resolves to the native
# OS chooser on loopback Windows — a dialog the hidden Node process cannot
# reliably raise above this window. Disable+insert matches
# apps/web/tests/pin-browse-picker.overlay.yml.
- id: directory-picker
  disabled: true
- insert:
    - id: directory-picker-browse
      name: '@deepseek-ai/dsh-host-directory-picker-browse'
    - id: ui-directory-picker-browse
      name: '@deepseek-ai/dsh-client-ui-directory-picker-browse'
